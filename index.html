function trackWorkspaceDeletions(previous,current){const now=new Date().toISOString();for(const kind of ["T","E","HD","H"]){const before=Array.isArray(previous[kind])?previous[kind]:[];const after=new Set((Array.isArray(current[kind])?current[kind]:[]).map(x=>String(x.id)));SYNC_TOMBSTONES[kind]=SYNC_TOMBSTONES[kind]||{};before.forEach(x=>{const id=String(x.id);if(!after.has(id))SYNC_TOMBSTONES[kind][id]=now})}const oldBL=previous.BL&&typeof previous.BL==="object"?previous.BL:{},newBL=current.BL&&typeof current.BL==="object"?current.BL:{};SYNC_TOMBSTONES.BL=SYNC_TOMBSTONES.BL||{};Object.keys(oldBL).forEach(k=>{if(!Object.prototype.hasOwnProperty.call(newBL,k))SYNC_TOMBSTONES.BL[k]=now})}
function promoteEditedDemoRecords(previous,current){for(const kind of ["T","E","HD","H"]){const before=Array.isArray(previous?.[kind])?previous[kind]:[],byId=new Map(before.map(x=>[String(x.id),x]));for(const record of Array.isArray(current[kind])?current[kind]:[]){if(!record.demo)continue;const old=byId.get(String(record.id));if(old?.demo&&String(record.updatedAt||record.updated_at||"")!==String(old.updatedAt||old.updated_at||""))record.demo=false}}}
function publishWorkspaceToOtherTabs(){try{const state=JSON.parse(localStorage.getItem(KEY)||"null");if(state&&TAB_CHANNEL)TAB_CHANNEL.postMessage({source:DEVICE_TAB_ID,state})}catch(e){}}
const DEVICE_TAB_ID=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"tab-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function save(){try{let previous=null;try{previous=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}let current=snapshotWorkspaceState();if(!CLOUD.applying){const baseline=TAB_BASELINE||previous||current;promoteEditedDemoRecords(baseline,current);trackWorkspaceDeletions(baseline,current);current=snapshotWorkspaceState();if(previous&&Array.isArray(previous.T)){const peer={...previous,SET:SET},local={...current,SET:SET};const merged=mergeWorkspacePayload(local,peer);assignWorkspaceState(merged);current=snapshotWorkspaceState()}}const persisted={...current,_deviceResetAt:DEVICE_RESET_STAMP};localStorage.setItem(KEY,JSON.stringify(persisted));TAB_BASELINE=snapshotWorkspaceState();if(AUTH?.user&&!CLOUD.applying){localStorage.setItem(LAST_LOCAL_KEY,String(Date.now()));if(CLOUD.syncState==="synced")setCloudSyncState("pending")}if(!CLOUD.applying&&!RESETTING_DEVICE)publishWorkspaceToOtherTabs()}catch(e){console.warn("Wild Workspace: local workspace save failed",e);return false}scheduleCloudSync();return true}
function saveSet(changedKey){SET.lv=[LV[0],LV[1]];if(SHARED_SETTING_KEYS.includes(changedKey)){SET.touched=SET.touched&&typeof SET.touched==="object"?SET.touched:{};SET.touched[changedKey]=new Date().toISOString()}SET.cloudUrl=SUPABASE_URL;SET.cloudKey=SUPABASE_PUBLISHABLE_KEY;const saved={...SET,touched:deepCloneData(SET.touched||{})};delete saved.cloudUrl;delete saved.cloudKey;try{localStorage.setItem(KS,JSON.stringify(saved));if(SHARED_SETTING_KEYS.includes(changedKey)&&AUTH?.user&&!CLOUD.applying){localStorage.setItem(LAST_LOCAL_KEY,String(Date.now()));if(CLOUD.syncState==="synced")setCloudSyncState("pending")}}catch(e){console.warn("Wild Workspace: settings save failed",e)}if(changedKey===undefined||SHARED_SETTING_KEYS.includes(changedKey))scheduleCloudSync()}

async function getLocalAttachment(id){const db=await openAttachmentDB();return new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,"readonly"),r=tx.objectStore(ATTACH_STORE).get(id);r.onsuccess=()=>{db.close();resolve(r.result||null)};r.onerror=()=>{db.close();reject(r.error)}})}
async function deleteLocalAttachment(id){if(!id||!window.indexedDB)return;try{const db=await openAttachmentDB();await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,"readwrite");tx.objectStore(ATTACH_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){console.warn("Attachment cleanup:",e)}}
async function clearLocalAttachments(){if(!window.indexedDB)return;const db=await openAttachmentDB();try{await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,"readwrite");tx.objectStore(ATTACH_STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error("Не удалось очистить файлы"))})}finally{db.close()}}
async function listLocalAttachmentIds(){if(!window.indexedDB)return[];const db=await openAttachmentDB();try{return await new Promise((resolve,reject)=>{const tx=db.transaction(ATTACH_STORE,"readonly"),req=tx.objectStore(ATTACH_STORE).getAllKeys();req.onsuccess=()=>resolve((req.result||[]).map(String));req.onerror=()=>reject(req.error||new Error("Не удалось прочитать локальные вложения"))})}finally{db.close()}}
async function listCloudAttachmentPaths(prefix,depth=0,budget={count:0}){if(depth>5)throw new Error("Слишком глубокая структура папок вложений; сборка остановлена для безопасности.");const paths=[];for(let offset=0;offset<5000;offset+=1000){const items=await cloudApi("/storage/v1/object/list/ww-attachments",{method:"POST",body:JSON.stringify({prefix,limit:1000,offset,sortBy:{column:"name",order:"asc"}})});if(!Array.isArray(items))throw new Error("Storage вернул некорректный список вложений.");for(const item of items){if(!item?.name)continue;budget.count++;if(budget.count>5000)throw new Error("Превышен лимит безопасной проверки вложений; удаление отменено.");if(item.id==null&&item.metadata==null){paths.push(...await listCloudAttachmentPaths(prefix?prefix+"/"+item.name:item.name,depth+1,budget))}else paths.push((prefix?prefix+"/":"")+item.name)}if(items.length<1000)break}return paths}
async function deleteCloudAttachmentPath(path){const encoded=String(path).split("/").map(encodeURIComponent).join("/"),r=await fetch(SET.cloudUrl.replace(/\/+$/,"" )+"/storage/v1/object/ww-attachments/"+encoded,{method:"DELETE",headers:{apikey:SET.cloudKey,Authorization:"Bearer "+AUTH.access_token}});if(!r.ok&&r.status!==404)throw new Error("Storage отказал при удалении файла (HTTP "+r.status+")")}
function scheduleAttachmentGarbageCollection(includeCloud=false){clearTimeout(CLOUD.gcTimer);CLOUD.gcTimer=setTimeout(()=>collectOrphanAttachments(includeCloud).catch(e=>console.warn("Attachment garbage collection:",e)),6000)}
async function collectOrphanAttachments(includeCloud=false){if(CLOUD.gcRunning||TASK_SAVE_BUSY||CLOUD.choicePending)return false;if(AUTH?.user&&CLOUD.syncState!=="synced"&&includeCloud)return false;CLOUD.gcRunning=true;try{const referencedIds=new Set([...(T||[]).flatMap(x=>Array.isArray(x.attachments)?x.attachments:[]),...(FORM_ATTACHMENTS||[])].map(a=>String(a?.id||"")).filter(Boolean));for(const id of await listLocalAttachmentIds()){if(TASK_SAVE_BUSY||CLOUD.choicePending)break;if(!referencedIds.has(String(id)))await deleteLocalAttachment(id)}if(includeCloud&&AUTH?.user&&CLOUD.enabled&&navigator.onLine&&CLOUD.syncState==="synced"&&!TASK_SAVE_BUSY&&!CLOUD.choicePending){const referencedPaths=new Set((T||[]).flatMap(x=>Array.isArray(x.attachments)?x.attachments:[]).map(a=>a?.storagePath).filter(Boolean));const paths=await listCloudAttachmentPaths(String(AUTH.user.id));for(const path of paths){if(TASK_SAVE_BUSY||CLOUD.choicePending)break;if(!referencedPaths.has(path))await deleteCloudAttachmentPath(path)}}return true}catch(e){console.warn("Attachment garbage collection skipped:",e);return false}finally{CLOUD.gcRunning=false}}

const attachmentIcon=a=>attachmentKind(a)==="image"?"image":attachmentKind(a)==="link"?"link":"attach_file";
function fmtBytes(n){if(!Number.isFinite(+n)||+n<0)return "";return n<1024?`${n} Б`:n<1048576?`${(+n/1024).toFixed(0)} КБ`:`${(+n/1048576).toFixed(1)} МБ`}
function attachmentRows(items,editable=false){if(!items||!items.length)return editable?'<div class="attachment-note">Пока нет вложений. Можно добавить фото, файл или ссылку.</div>':"";return `<div class="attachments-list">${items.map(a=>`<div class="attachment-row"><span class="attachment-icon"><span class="i">${attachmentIcon(a)}</span></span><div class="attachment-info"><b title="${esc(a.name)}">${esc(a.name)}</b><small>${attachmentKind(a)==="link"?esc(a.url||""):fmtBytes(a.size)}${a.storagePath?" · ☁ в облаке":a.localOnly?" · только на этом устройстве":""}</small></div><div class="attachment-actions"><button type="button" class="attachment-action" data-openattachment="${esc(a.id)}" title="Открыть" aria-label="Открыть ${esc(a.name)}"><span class="i">open_in_new</span></button>${editable?`<button type="button" class="attachment-action danger" data-remove-attachment="${esc(a.id)}" title="Убрать" aria-label="Убрать ${esc(a.name)}"><span class="i">close</span></button>`:""}</div></div>`).join("")}</div>`}
function renderFormAttachments(){const wrap=$("taskAttachmentsList");if(wrap)wrap.innerHTML=attachmentRows(FORM_ATTACHMENTS,true);const panel=$("taskExtraAttachments");if(panel)panel.classList.toggle("hide",!FORM_ATTACHMENTS.length);const chip=document.querySelector('[data-toggle-extra="attachments"]');if(chip)chip.innerHTML=`<span class="i">attach_file</span>Вложения${FORM_ATTACHMENTS.length?` · ${FORM_ATTACHMENTS.length}`:""}`}
async function stageAttachmentFiles(files){for(const file of [...files]){if(!file)continue;if(file.size>10*1024*1024){toast(`«${file.name}» больше 10 МБ — добавь файл поменьше`);continue}if(FORM_ATTACHMENTS.length>=12){toast("К одной задаче можно добавить до 12 вложений");break}const id="att-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8);FORM_ATTACHMENTS.push({id,name:file.name||"Файл",kind:file.type&&file.type.startsWith("image/")?"image":"file",mime:file.type||"application/octet-stream",size:file.size,localOnly:true});FORM_PENDING_FILES.set(id,file)}renderFormAttachments();if(FORM_ATTACHMENTS.length)$("taskExtraAttachments")?.classList.remove("hide")}
function addAttachmentLink(){const name=$("f_linkName")?.value.trim(),url=$("f_linkUrl")?.value.trim();if(!url)return toast("Вставь ссылку");let u;try{u=new URL(url)}catch(e){return toast("Проверь формат ссылки")};if(!["http:","https:"].includes(u.protocol))return toast("Поддерживаются ссылки http и https");FORM_ATTACHMENTS.push({id:"att-link-"+Date.now().toString(36),name:name||u.hostname,url:u.href,kind:"link",mime:"text/uri-list",size:0});if($("f_linkName"))$("f_linkName").value="";if($("f_linkUrl"))$("f_linkUrl").value="";renderFormAttachments();$("taskExtraAttachments")?.classList.remove("hide");toast("Ссылка прикреплена")}
async function uploadCloudAttachment(taskId,meta,file){if(!AUTH?.user||!CLOUD.enabled||!SET.cloudUrl||!SET.cloudKey)return "";const safe=String(meta.name||"file").normalize("NFKD").replace(/[^a-zA-Z0-9._-]+/g,"_").slice(-90)||"file";const path=`${AUTH.user.id}/${taskId}/${meta.id}_${safe}`;const url=SET.cloudUrl.replace(/\/+$/,"" )+"/storage/v1/object/ww-attachments/"+path.split("/").map(encodeURIComponent).join("/");const r=await fetch(url,{method:"POST",headers:{apikey:SET.cloudKey,Authorization:"Bearer "+AUTH.access_token,"Content-Type":file.type||"application/octet-stream","x-upsert":"true"},body:file});if(!r.ok){let msg=`HTTP ${r.status}`;try{const j=await r.json();msg=j.message||j.error||msg}catch(e){}throw new Error(msg)}return path}
async function signedAttachmentUrl(path){if(!AUTH?.user||!CLOUD.enabled)throw new Error("Войди в аккаунт, чтобы открыть облачное вложение.");const url=SET.cloudUrl.replace(/\/+$/,"" )+"/storage/v1/object/sign/ww-attachments/"+path.split("/").map(encodeURIComponent).join("/");const r=await fetch(url,{method:"POST",headers:{apikey:SET.cloudKey,Authorization:"Bearer "+AUTH.access_token,"Content-Type":"application/json"},body:JSON.stringify({expiresIn:3600})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||`Не удалось открыть файл (${r.status})`);return j.signedURL?.startsWith("http")?j.signedURL:SET.cloudUrl.replace(/\/+$/,"" )+j.signedURL}
async function openAttachment(id){const allAtt=T.flatMap(x=>x.attachments||[]),a=FORM_ATTACHMENTS.find(x=>String(x.id)===String(id))||allAtt.find(x=>String(x.id)===String(id));if(!a)return toast("Вложение не найдено");if(attachmentKind(a)==="link"){const url=safeWebUrl(a.url);if(!url)return toast("Небезопасная ссылка отклонена");window.open(url,"_blank","noopener,noreferrer");return}const safeInlineMime=/^(image\/(?:png|jpeg|gif|webp|avif)|audio\/(?:mpeg|ogg|wav|webm)|video\/(?:mp4|webm))$/i;const downloadBlob=(blob,name)=>{const href=URL.createObjectURL(blob),el=document.createElement("a");el.href=href;el.download=String(name||"download").replace(/[\r\n\\/]/g,"_").slice(0,240)||"download";el.rel="noopener";document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(href),60000)};try{const local=await getLocalAttachment(a.id);if(local?.blob){const mime=String(local.type||a.mime||local.blob.type||"application/octet-stream").toLowerCase();if(!safeInlineMime.test(mime)){downloadBlob(local.blob,a.name);toast("Этот тип файла скачивается для безопасности");return}const href=URL.createObjectURL(new Blob([local.blob],{type:mime})),win=window.open("about:blank","_blank","noopener,noreferrer");if(win)win.location.replace(href);else downloadBlob(local.blob,a.name);setTimeout(()=>URL.revokeObjectURL(href),60000);return}if(a.storagePath){const href=await signedAttachmentUrl(a.storagePath),mime=String(a.mime||"application/octet-stream").toLowerCase();if(safeInlineMime.test(mime)){window.open(href,"_blank","noopener,noreferrer");return}const response=await fetch(href);if(!response.ok)throw new Error("Не удалось скачать файл из облака");downloadBlob(await response.blob(),a.name);toast("Этот тип файла скачивается для безопасности");return}toast("Файл хранится только на устройстве, где его добавили.")}catch(e){toast(e.message||"Не удалось открыть вложение")}}
async function removeAttachment(id){FORM_ATTACHMENTS=FORM_ATTACHMENTS.filter(x=>x.id!==id);FORM_PENDING_FILES.delete(id);renderFormAttachments()}
async function cleanupAttachment(a,options={}){if(!a||attachmentKind(a)==="link")return;await deleteLocalAttachment(a.id);if(options.cloud!==false&&a.storagePath&&AUTH?.user&&CLOUD.enabled){try{await deleteCloudAttachmentPath(a.storagePath)}catch(e){console.warn("Cloud file cleanup:",e)}}}
async function syncTaskAttachments(){if(!AUTH?.user||!CLOUD.enabled)return false;let changed=false;const failed=[];for(const x of T){let taskChanged=false;for(const a of x.attachments||[]){if(attachmentKind(a)==="link"||a.storagePath)continue;try{const local=await getLocalAttachment(a.id);if(!local?.blob){if(!a.localOnly){a.localOnly=true;taskChanged=true}failed.push(a.name||"вложение");continue}const path=await uploadCloudAttachment(x.id,a,local.blob);if(path){a.storagePath=path;if(a.localOnly){delete a.localOnly}taskChanged=true}else{if(!a.localOnly){a.localOnly=true;taskChanged=true}failed.push(a.name||"вложение")}}catch(e){if(!a.localOnly){a.localOnly=true;taskChanged=true}failed.push(a.name||"вложение");console.warn("Cloud attachment upload:",a.name,e.message)}}if(taskChanged){x.updatedAt=new Date().toISOString();changed=true}}if(changed)try{localStorage.setItem(KEY,JSON.stringify({...snapshotWorkspaceState(),_deviceResetAt:DEVICE_RESET_STAMP}))}catch(e){}if(failed.length){const note=`Не все вложения попали в облако (${failed.length}). Они помечены «только на этом устройстве». Проверь Storage и supabase-setup.sql.`;console.warn(note,failed);toast(note)}return changed}
